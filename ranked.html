<script id="fb-analytics">
/* ==========================================================================
   FinnBots ANALYTICS LAYER — how the games are PLAYED, counted, never who plays.
   Founder, 2026-10-19: approved the four-phase analytics plan ("FinnBots
   Analytics Plan" doc) — "Also keep this all free", and: "Ensure that this
   reporting layer does not affect anything else cloud flare supports for
   finnbots or cost me anything the data doesnt have to be realtime".

   SOURCE OF TRUTH. Injected by apply-analytics.js as <script id="fb-analytics">
   just before </body>, beside the Cloudflare beacon tag (page views come from
   the beacon, which is not a Worker and spends nothing of ours; this layer adds
   what the beacon cannot see). Entirely passive:

     - it NEVER touches the engine, the wallet layer or a wallet
     - it watches the run-over card (#overOverlay) and the paid panel
       (#paidOverlay) — the same elements the stickiness layer reads
     - no cookie, no ID: what it keeps on the device is a handful of COUNTS
       for this game, and the date it last sent them

   AT MOST ONE REQUEST PER DEVICE PER DAY. Every request to the events Worker
   spends the account's FREE Workers allowance (100,000 a day), and that
   allowance is SHARED with the RPC Worker every paid entry needs. Real time is
   not wanted, so counts pile up on the device and leave once a day, on the
   first page-hide of a new UTC day (or the first one ever). What is sent: the
   device class (phone / tablet / laptop) and, since the last send, how many
   visits there were, how many touched the game, how many runs ended, how many
   times the paid panel opened, and how many visits finished a run / opened the
   paid panel. The game is NOT in the payload — the Worker reads it from the
   Origin header, so a payload cannot claim to be another game. Nothing is sent
   off the live domain (local playtests and gates never send). If the browser
   will not store anything (private mode), it sends at most once per page.

   WHERE A VISIT CAME FROM (v3, 2026-11-16; Founder: "build the per-channel tracking"). Our posts' links carry a short
   tag (?from=x, ?from=discord); otherwise the referring SITE'S NAME only (t.co -> x, google.* -> search, our own pages
   -> site, anything else -> its registrable name, e.g. ref:example.com), or "direct". Never a full address, never a
   path, never anything about the person. Each channel is a handful of counts (visits, touched, runs, finished) that
   ride in the SAME once-a-day request; a visit is counted even if the game was never touched (that is the leak we
   need to see). The ?from= tag is removed from the address bar at once, so a player who shares the page does not
   pass our tag on.

   v4 (2026-11-17; Founder: "build all three"):
     - PER-POST TAGS: ?from=x-w49a (a channel tag + a post id of 2-10 a-z/0-9) is kept whole, so the report can say
       which POST brought players. Anything else after the dash is tag-other.
     - PLAYED AGAIN: a visit that finished one run and went on to another (t). Each channel row gains it as a 5th count.
     - COMING BACK: the device keeps ONE date per game - the day it first played here - and never sends it. Each visit
       that touches the game is counted in one of three piles (u): [first day, back within 7 days, back after 7 days].
       A device that already played before v4 (it has a last-send date) counts from that date, so a regular is not
       mistaken for a newcomer on the day this ships. Still no id: the date stays on the device, only the pile leaves.

   v5 (2026-11-18; Founder: "Yes, clean it"): A VISIT IS A PERSON. Automated page loads ran this layer too: 19 of the
   counter's first 24 "game visits" (16-17 Nov) were on the three games the crawler spike hit, came in direct and
   never touched the game. Now nothing about a page is banked or sent until it has seen ONE real input from a person:
   a mouse move, a touch, a key or a wheel (isTrusted - a script's synthetic event does not count). A person who
   looks and leaves still moves a pointer or a thumb, so the leak we need to see stays visible; a renderer that
   loads and closes leaves no trace. Cloudflare's page views remain the "every load" number.
   ========================================================================== */
(function(){
  try{
    var END = 'https://finnbots-events.finnstergram.com/e';
    var host = String(location.hostname || '');
    if(!/\.finnstergram\.com$/.test(host)) return;           // live games only
    if(!navigator.sendBeacon) return;
    var $ = function(id){ return document.getElementById(id); };
    var KEY = 'fb:' + host.split('.')[0] + ':counts';
    var ZERO = function(){ return { n:0, s:0, r:0, p:0, f:0, q:0, t:0, u:[0, 0, 0] }; };
    var FIRST = 'fb:' + host.split('.')[0] + ':first';                    // the day this device first played here (never sent)
    var day = function(){ return new Date().toISOString().slice(0, 10); };

    var dev = (function(){
      var coarse = false;
      try{ coarse = matchMedia('(pointer: coarse)').matches; }catch(e){}
      if(!coarse) return 'laptop';
      var s = (typeof screen !== 'undefined') ? Math.min(screen.width || 0, screen.height || 0) : 0;
      return (s && s < 600) ? 'phone' : 'tablet';
    })();

    /* where this visit came from (see the header): a tag on our own links, else the referring site's name */
    var TAGS = { x:1, discord:1, site:1, parents:1, holders:1, email:1, qr:1 };
    var chan = (function(){
      var q = String(location.search || ''), m = /[?&]from=([^&#]*)/.exec(q);
      if(/[?&](phantom_action=|src=browse\b)/.test(q)) return 'wallet';            // a wallet return is the same visit coming back
      if(m){ var t = String(m[1]).toLowerCase();
        try{ if(window.history && history.replaceState){                         // our tag never travels on in a share
          var rest = q.replace(/([?&])from=[^&#]*&?/, '$1').replace(/[?&]$/, '');
          history.replaceState(history.state, '', (location.pathname || '/') + rest + (location.hash || '')); } }catch(e){}
        if(TAGS[t]) return t;
        var pt = /^([a-z]+)-([a-z0-9]{2,10})$/.exec(t);                          // a per-post tag: x-w49a
        return (pt && TAGS[pt[1]]) ? t : 'tag-other'; }
      var h = (/^https?:\/\/([^\/:?#]+)/i.exec(String(document.referrer || '')) || [])[1];
      if(!h) return 'direct';
      h = h.toLowerCase().replace(/^www\./, '');
      if(/(^|\.)finnstergram\.com$/.test(h)) return 'site';
      if(/^(t\.co|x\.com|twitter\.com|mobile\.twitter\.com|m\.twitter\.com)$/.test(h)) return 'x';
      if(/(^|\.)(discord\.com|discordapp\.com|discord\.gg)$/.test(h)) return 'discord';
      if(/(^|\.)(google\.[a-z.]+|bing\.com|duckduckgo\.com|yahoo\.[a-z.]+|ecosia\.org|search\.brave\.com|yandex\.[a-z.]+|baidu\.com)$/.test(h)) return 'search';
      var p = h.split('.').filter(Boolean), k = (p.length > 2 && /^(co|com|org|net|ac|gov|edu)$/.test(p[p.length-2]) && p[p.length-1].length === 2) ? 3 : 2;
      var name = p.slice(-k).join('.');
      return /^[a-z0-9.-]{3,40}$/.test(name) ? 'ref:' + name : 'ref:other';
    })();

    /* this visit, as it happens */
    var v = { s:0, r:0, p:0, f:0, q:0, t:0 }, banked = { s:0, r:0, p:0, f:0, q:0, t:0 }, visitBanked = false, chanBanked = false, backBanked = false, sentThisPage = false;

    /* 0. a PERSON is here (v5): any real input at all, chrome or game. Until then nothing is banked or sent. */
    var human = false;
    var person = function(e){ if(!e || e.isTrusted !== false) human = true; };
    ['pointermove', 'pointerdown', 'touchstart', 'keydown', 'wheel'].forEach(function(t){
      addEventListener(t, person, { capture:true, passive:true }); });

    /* 1. played: the first input that is not on the page's own chrome */
    var chrome = function(t){
      return !!(t && t.closest && t.closest('button, a, input, select, textarea, summary, .overlay, .sheet, .topbar'));
    };
    var dialog = function(){ return !!document.querySelector('.overlay.show, .sheet.show'); };
    addEventListener('keydown', function(){ if(!v.s && !dialog()) v.s = 1; }, true);
    addEventListener('pointerdown', function(e){ if(!v.s && !chrome(e && e.target)) v.s = 1; }, true);

    /* 2. a run ended, 3. the paid panel opened — each a rising edge of .show */
    function edge(el, fn){
      if(!el) return;
      var on = el.classList.contains('show');
      new MutationObserver(function(){
        var now = el.classList.contains('show');
        if(now && !on) fn();
        on = now;
      }).observe(el, { attributes:true, attributeFilter:['class'] });
    }
    edge($('overOverlay'), function(){ v.r++; v.s = 1; v.f = 1; if(v.r >= 2) v.t = 1; });
    edge($('paidOverlay'), function(){ v.p++; v.q = 1; });

    /* the device's pile of unsent counts */
    var store = null;
    function load(){
      try{ var o = JSON.parse(localStorage.getItem(KEY) || 'null');
           if(o && o.c && typeof o.c.r === 'number'){ if(!o.ch || typeof o.ch !== 'object') o.ch = {};
             if(typeof o.c.t !== 'number') o.c.t = 0; if(!Array.isArray(o.c.u) || o.c.u.length !== 3) o.c.u = [0, 0, 0]; return o; } }catch(e){}
      return { sent:'', c:ZERO(), ch:{} };
    }
    function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); return localStorage.getItem(KEY) !== null; }catch(e){ return false; } }

    /* which pile a touched visit goes in: 0 = the device's first day here, 1 = back within 7 days, 2 = back after 7.
       null = storage will not keep a date (private mode): counted nowhere rather than guessed. */
    function backPile(prevSent){
      var t = day(), f = null;
      try{ f = localStorage.getItem(FIRST); }catch(e){ return null; }
      if(!/^\d{4}-\d{2}-\d{2}$/.test(f || '')){
        f = (/^\d{4}-\d{2}-\d{2}$/.test(prevSent || '') && prevSent < t) ? prevSent : t;   // played before v4: count from then
        try{ localStorage.setItem(FIRST, f); if(localStorage.getItem(FIRST) !== f) return null; }catch(e){ return null; }
      }
      var gap = Math.round((Date.parse(t) - Date.parse(f)) / 864e5);
      return gap <= 0 ? 0 : gap <= 7 ? 1 : 2;
    }

    /* bank what this visit added since the last bank, then send the pile if today has not had a send */
    function flush(){
      if(!human) return;                                         // v5: no person seen - a page load is not a visit
      var d = { s:v.s - banked.s, r:v.r - banked.r, p:v.p - banked.p, f:v.f - banked.f, q:v.q - banked.q, t:v.t - banked.t };
      var any = d.s || d.r || d.p;
      store = load();
      /* the channel pile: EVERY visit counts once (touched or not), then what it did */
      var key = chan;
      if(!store.ch[key] && Object.keys(store.ch).length >= 6) key = 'other';   // at most 6 channels in one day's request
      var cc = store.ch[key] || (store.ch[key] = [0, 0, 0, 0, 0]);            // [visits, touched, runs, finished, played again]
      if(cc.length < 5) cc.push(0);
      if(!chanBanked){ cc[0]++; chanBanked = true; }
      if(any){
        if(!visitBanked){ store.c.n++; visitBanked = true; }
        store.c.s += d.s; store.c.r += d.r; store.c.p += d.p; store.c.f += d.f; store.c.q += d.q; store.c.t += d.t;
        cc[1] += d.s; cc[2] += d.r; cc[3] += d.f; cc[4] += d.t;
        if(v.s && !backBanked){ var bp = backPile(store.sent); if(bp !== null) store.c.u[bp]++; backBanked = true; }
        banked = { s:v.s, r:v.r, p:v.p, f:v.f, q:v.q, t:v.t };
      }
      var kept = save(store);
      var c = store.c, visits = 0;
      for(var ck in store.ch) visits += store.ch[ck][0];
      if(!(c.s || c.r || c.p) && !visits) return;
      if(kept ? store.sent === day() : sentThisPage) return;   // already sent today (or, unstored, this page)
      var body = JSON.stringify({ v:4, d:dev, n:c.n, s:c.s, r:c.r, p:c.p, f:c.f, q:c.q, t:c.t, u:c.u, ch:store.ch });
      if(navigator.sendBeacon(END, body)){
        sentThisPage = true;
        store.sent = day(); store.c = ZERO(); store.ch = {}; save(store);
      }
    }
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState === 'hidden') flush();
    });
    addEventListener('pagehide', flush);
    window.FB_ANALYTICS_STATE = function(){ return { dev:dev, visit:{ s:v.s, r:v.r, p:v.p, f:v.f, q:v.q, t:v.t }, store:load() }; };
  }catch(e){ /* analytics must never break a game */ }
})();
</script>
